server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    client_max_body_size 8m;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
  }

  location / {
    try_files $uri /index.html;
  }
}
