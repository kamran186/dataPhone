services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dataphone
      POSTGRES_USER: dataphone
      POSTGRES_PASSWORD: ${DATAPHONE_DATABASE_PASSWORD:-dataphone-local}
    ports:
      - "127.0.0.1:54328:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [dataphone]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataphone -d dataphone"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://dataphone:${DATAPHONE_DATABASE_PASSWORD:-dataphone-local}@postgres:5432/dataphone
      CORS_ORIGIN: http://localhost:8080
      DATAPHONE_PORT_ENCRYPTION_KEY: ${DATAPHONE_PORT_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      DATAPHONE_ENABLE_MOCK_CARRIER: ${DATAPHONE_ENABLE_MOCK_CARRIER:-true}
      DATAPHONE_SEED_DEMO: ${DATAPHONE_SEED_DEMO:-true}
      DATAPHONE_DEMO_PASSWORD: ${DATAPHONE_DEMO_PASSWORD:-Admin@123456}
    # Optional untracked file for carrier test credentials, one KEY=value per line.
    env_file:
      - path: .env.carriers
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks: [dataphone]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on: [api]
    networks: [dataphone]

volumes:
  postgres_data:

networks:
  dataphone:
